[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pt-calendar-manager"
version = "0.16.3"
description = "Accessible desktop application for Google Calendar"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-or-later"
authors = [
    { name = "Piotr Tarasewicz" },
]
keywords = ["accessibility", "calendar", "google-calendar", "screen-reader", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "wxPython==4.2.5",
    "google-api-python-client==2.198.0",
    "google-auth-oauthlib==1.4.0",
    "tzdata==2026.3",
]

[project.urls]
Homepage = "https://ptprojects.app/"
Documentation = "https://github.com/piotrktarasewicz/ptcalendarmanager/tree/main/desktop/docs"
Source = "https://github.com/piotrktarasewicz/ptcalendarmanager"
Releases = "https://github.com/piotrktarasewicz/ptcalendarmanager/releases"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
