[project]
name = "pt-calendar-manager"
version = "0.15.1"
description = "Accessible desktop application for Google Calendar"
requires-python = ">=3.10,<3.14"
dependencies = [
    "wxPython==4.2.5",
    "google-api-python-client==2.198.0",
    "google-auth-oauthlib==1.4.0",
    "tzdata==2026.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
