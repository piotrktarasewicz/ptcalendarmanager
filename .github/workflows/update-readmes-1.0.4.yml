name: Update README files for 1.0.4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-readmes-1.0.4.yml

permissions:
  contents: write

jobs:
  update-readmes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update version links and release summary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          en_path = Path('README.md')
          en = en_path.read_text(encoding='utf-8')
          en = en.replace('Google Calendar Manager 1.0.3', 'Google Calendar Manager 1.0.4')
          en = en.replace('/v1.0.3/googleCalendarManager-1.0.3.nvda-addon', '/v1.0.4/googleCalendarManager-1.0.4.nvda-addon')
          en = en.replace('Version 1.0.3 is the latest public test version.', 'Version 1.0.4 is the latest public test version.')
          marker = 'Version 1.0.4 is the latest public test version.\n\n'
          addition = (
              'Version 1.0.4 is the latest public test version.\n\n'
              'This version fixes event editing across years, preserves multi-day timed ranges, '
              'handles timed-to-all-day conversion correctly, and shows technical error details '
              'in an accessible NVDA dialog.\n\n'
          )
          if marker not in en:
              raise SystemExit('English status marker not found')
          en = en.replace(marker, addition, 1)
          en_path.write_text(en, encoding='utf-8', newline='\n')

          pl_path = Path('README_pl.md')
          pl = pl_path.read_text(encoding='utf-8')
          pl = pl.replace('Google Calendar Manager 1.0.3', 'Google Calendar Manager 1.0.4')
          pl = pl.replace('/v1.0.3/googleCalendarManager-1.0.3.nvda-addon', '/v1.0.4/googleCalendarManager-1.0.4.nvda-addon')
          pl = pl.replace('Wersja 1.0.3 jest najnowszą publiczną wersją testową.', 'Wersja 1.0.4 jest najnowszą publiczną wersją testową.')
          marker = 'Wersja 1.0.4 jest najnowszą publiczną wersją testową.\n\n'
          addition = (
              'Wersja 1.0.4 jest najnowszą publiczną wersją testową.\n\n'
              'W tej wersji poprawiono zachowanie roku podczas edycji, obsługę wielodniowych '
              'wydarzeń godzinowych, zmianę wydarzenia godzinowego na całodniowe oraz '
              'wyświetlanie technicznych szczegółów błędu w dostępnym oknie NVDA.\n\n'
          )
          if marker not in pl:
              raise SystemExit('Polish status marker not found')
          pl = pl.replace(marker, addition, 1)
          pl_path.write_text(pl, encoding='utf-8', newline='\n')
          PY

      - name: Commit README updates and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-readmes-1.0.4.yml
          git add README.md README_pl.md
          git commit -m "Update README files for 1.0.4"
          git push origin HEAD:main
